[package]
name = "storage-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
storage = { path = "../../../crates/storage" }
storage-migrations = { path = "../../../crates/storage-migrations" }

wasm-bindgen = "0.2.130"
eyre = "0.6.14"
gloo-worker = { version = "0.7.0", features = ["futures"] }
serde_json = "1.0.154"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
