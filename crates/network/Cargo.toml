[package]
name = "network"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "sync",
    "time",
] }
iroh = "1.5.0"
iroh-blobs = { version = "0.105.0", default-features = false }
blake3 = "1.8.7"
hex = "0.4.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
tokio = { version = "1.54.1", features = ["rt"] }
