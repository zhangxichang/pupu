[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
blake3 = "1.8.7"
sea-query = { version = "1.0.2", default-features = false, features = [
    "backend-sqlite",
    "derive",
    "thread-safe",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["js", "v4"] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
storage-migrations = { path = "../storage-migrations" }

rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
gloo-worker = { version = "0.7.0", features = ["futures"] }
