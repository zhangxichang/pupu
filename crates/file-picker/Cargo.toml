[package]
name = "file-picker"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
async-stream = "0.3.6"
futures-core = "0.3.34"
futures-util = "0.3.34"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
rfd = { version = "0.18.0", default-features = false, features = [
    "xdg-portal",
] }
tokio = { version = "1.54.1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4.35"
jni = "0.22.4"
ndk-context = "0.1.1"
parking_lot = "0.13.0"
tokio = { version = "1.54.1", features = ["sync", "fs", "io-util"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rfd = { version = "0.18.0", default-features = false, features = [
    "file-handle-inner",
] }
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Blob", "File"] }
