[workspace]
members = [
    "android/app/rust",
    "web/wasm/*",
    "app",
    "runtime",
    "crates/*",
    "test/*",
]

[package]
name = "pupu"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "app" }
paths = { path = "crates/paths" }

log = "0.4.35"
env_logger = "0.11.11"
eyre = "0.6.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
directories = "6.0.0"
