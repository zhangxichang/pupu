[package]
name = "test-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
test-protocol = { path = "../protocol" }

eyre = "0.6.14"
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
