[package]
name = "test-peer"
version = "0.1.0"
edition = "2024"

[dependencies]
test-protocol = { path = "../protocol" }
runtime = { path = "../../runtime" }

eyre = "0.6.14"
log = "0.4.35"
env_logger = "0.11.11"
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.22.1"
