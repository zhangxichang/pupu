name: Web发布
concurrency:
  group: release-web
  cancel-in-progress: true
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build-release:
    name: 构建并发布
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: 检出
        uses: actions/checkout@v7.0.1
      - name: 安装 bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: 安装 rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2.9.3
      - name: 安装 cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.27.0
      - name: 安装 wasm-pack
        run: cargo binstall wasm-pack@0.15.1 --no-confirm
      - name: 安装依赖
        run: bun install
      - name: 构建
        run: bun run build
      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
