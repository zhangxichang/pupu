name: Web发布
concurrency:
  group: web-release
  cancel-in-progress: true
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build-release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7
      - name: 安装bun
        uses: oven-sh/setup-bun@v2
      - name: 安装rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: 安装cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: 安装trunk
        run: cargo binstall trunk@0.22.0 --no-confirm
      - name: 构建
        run: trunk build --release
      - name: 查找要上传R2的文件
        run: |
          set -euo pipefail
          WASM=$(find dist -maxdepth 1 -name 'pupu-*_bg.wasm' -print -quit)
          test -n "$WASM"
          echo "R2_OBJECT_KEY=$(basename "$WASM")" >> "$GITHUB_ENV"
          echo 'pupu-*_bg.wasm' > dist/.assetsignore
      - name: 发布
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          preCommands: |
            wrangler r2 object put "pupu-apac/$R2_OBJECT_KEY" --file "dist/$R2_OBJECT_KEY" --content-type application/wasm --cache-control "public, max-age=31536000, immutable" --remote
      - name: 清理旧R2文件
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$R2_OBJECT_KEY"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/pupu-apac/objects"
          OBJECTS=$(mktemp)
          DELETE_KEYS=$(mktemp)
          trap 'rm -f "$OBJECTS" "$DELETE_KEYS"' EXIT

          # 收集所有主 wasm 的修改时间和 key
          cursor=""
          while :; do
            args=(--get "$API" --data-urlencode "prefix=pupu-" --data-urlencode "per_page=1000")
            [[ -z "$cursor" ]] || args+=(--data-urlencode "cursor=$cursor")

            response=$(curl -fsS "${args[@]}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            jq -e '.success' <<<"$response" >/dev/null

            jq -r '
              .result[]
              | select(.key | test("^pupu-[0-9a-f]+_bg\\.wasm$"))
              | [.last_modified, .key] | @tsv
            ' <<<"$response" >> "$OBJECTS"

            cursor=$(jq -r '.result_info.cursor // empty' <<<"$response")
            truncated=$(jq -r '.result_info.is_truncated // false' <<<"$response")
            [[ "$truncated" == true && -n "$cursor" ]] || break
          done

          # 最近修改的排前面
          sort -r -k1,1 "$OBJECTS" -o "$OBJECTS"

          cut -f2 "$OBJECTS" | grep -Fqx "$R2_OBJECT_KEY" || {
            echo "当前对象未出现在 R2 列表中: $R2_OBJECT_KEY" >&2
            exit 1
          }

          # 保留当前文件 + 最近的一个其他版本
          awk -F '\t' -v keep="$R2_OBJECT_KEY" '
            { keys[NR] = $2 }
            END {
              previous = ""
              for (i = 1; i <= NR; i++) {
                if (keys[i] != keep) { previous = keys[i]; break }
              }
              for (i = 1; i <= NR; i++) {
                if (keys[i] != keep && keys[i] != previous) print keys[i]
              }
            }
          ' "$OBJECTS" > "$DELETE_KEYS"

          echo "保留当前文件: $R2_OBJECT_KEY"
          echo "待删除文件数量: $(wc -l < "$DELETE_KEYS")"

          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            echo "删除: $key"
            curl -fsS -X DELETE "$API/$key" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" |
              jq -e '.success' >/dev/null
          done < "$DELETE_KEYS"
