[package]
name = "app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
slint-build = "1.19.0"
lucide-slint = "1.77.0"

[dependencies]
file-picker = { path = "../crates/file-picker" }
markdown = { path = "../crates/markdown" }
paths = { path = "../crates/paths" }
runtime = { path = "../runtime" }

log = "0.4.35"
eyre = "0.6.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
webbrowser = "1.2.7"

# extism = "1.41.0"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "fs", "time"] }
semver = "1.0.28"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
arboard = "3.7.0"
slint = { version = "1.19.0", default-features = false, features = [
    "compat-1-2",
    "unstable-winit-030",
    "unstable-wgpu-30",
    "renderer-skia",
    "unstable-fontique-012",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19.0", default-features = false, features = [
    "compat-1-2",
    "backend-android-activity-06",
    "unstable-wgpu-30",
    "unstable-fontique-012",
] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
ready-notify = { path = "../web/wasm/ready-notify" }

slint = { version = "1.19.0", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "unstable-fontique-012",
] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Navigator", "Clipboard"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
tokio-fs-ext = "0.7.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
