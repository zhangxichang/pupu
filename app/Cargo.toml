[package]
name = "app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
eyre = "0.6.14"
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"

# TODO 待未来实现插件功能
# extism = "1.30.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.2", default-features = false }

[target.'cfg(not(any(target_family = "wasm", target_os = "android")))'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "unstable-winit-030",
    "renderer-femtovg-wgpu",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-android-activity-06",
    "unstable-wgpu-29",
] }

[target.'cfg(all(target_os = "unknown", target_arch = "wasm32"))'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
] }
gloo-worker = { version = "0.6.0", features = ["futures"] }
sqlite-wasm-rs = "0.5.5"
sqlite-wasm-vfs = "0.2.0"
