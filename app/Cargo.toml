[package]
name = "app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
storage = { path = "../crates/storage" }

log = "0.4.34"
eyre = "0.6.14"

# TODO 待未来实现插件功能
# extism = "1.30.0"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
tokio = { version = "1.53.2", features = ["fs"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "unstable-winit-030",
    "unstable-wgpu-30",
    "renderer-skia",
    "unstable-fontique-011",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-android-activity-06",
    "unstable-wgpu-30",
    "unstable-fontique-011",
] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
lifecycle = { path = "../web/wasm/lifecycle" }

slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "unstable-fontique-011",
] }
opfs = "0.3.1"
