[package]
name = "android"
version = "0.1.0"
edition = "2024"

[lib]
name = "app"
crate-type = ["cdylib"]

[dependencies]
app = { path = "../../../app" }
paths = { path = "../../../crates/paths" }
file-picker = { path = "../../../crates/file-picker" }

log = "0.4.35"
android_logger = "0.15.1"
eyre = "0.6.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
slint = { version = "1.19.0", default-features = false, features = [
    "compat-1-2",
    "backend-android-activity-06",
] }
jni = "0.22.4"
